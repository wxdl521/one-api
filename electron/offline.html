<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="utf-8">
  <title>The One</title>
  <style>
    body {
      margin: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      font-family: system-ui, -apple-system, sans-serif;
      background: #f5f5f5;
      color: #333;
    }
    main { text-align: center; }
    button {
      margin-top: 16px;
      padding: 8px 24px;
      font-size: 14px;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <main>
    <h1>无法连接服务器</h1>
    <p>请检查网络连接后重试。</p>
    <button id="retry">重试</button>
  </main>
  <script>
    // Only follow the retry target if it is an http(s) URL; never javascript:/file:/etc.
    var retryUrl = new URLSearchParams(location.search).get('retry')
    var retryOk = retryUrl && (retryUrl.indexOf('https://') === 0 || retryUrl.indexOf('http://') === 0)
    document.getElementById('retry').addEventListener('click', function () {
      if (retryOk) {
        location.href = retryUrl
      }
    })
  </script>
</body>
</html>
