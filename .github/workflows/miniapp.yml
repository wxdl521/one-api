name: Mini Program

on:
  pull_request:
    paths:
      - 'miniapp/**'
      - '.github/workflows/miniapp.yml'
  push:
    branches:
      - main
    paths:
      - 'miniapp/**'
      - '.github/workflows/miniapp.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Verify Mini Program
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: miniapp
    steps:
      - name: Check out
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: latest

      - name: Install locked dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Test
        run: bun run test

      - name: Build WeChat Mini Program
        run: bun run build:weapp
